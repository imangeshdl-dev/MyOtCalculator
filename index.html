<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overtime Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator-card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 24px;
            font-size: 22px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }

        input[type="number"], input[type="month"], select {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            background-color: #fff;
        }

        input[type="number"]:focus, input[type="month"]:focus, select:focus {
            border-color: #3182ce;
        }

        .days-badge {
            font-size: 12px;
            color: #2b6cb0;
            background-color: #ebf8ff;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 6px;
            display: inline-block;
            font-weight: 500;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2b6cb0;
        }

        .result-box {
            margin-top: 24px;
            padding: 16px;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            text-align: center;
        }

        .result-title {
            font-size: 13px;
            color: #166534;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .result-amount {
            font-size: 24px;
            font-weight: 700;
            color: #15803d;
        }

        .formula-note {
            margin-top: 20px;
            font-size: 11px;
            color: #a0aec0;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h2>Overtime Calculator</h2>

        <!-- Earnings Inputs -->
        <div class="input-group">
            <label for="basic">Basic Pay</label>
            <input type="number" id="basic" placeholder="e.g. 15000" min="0" step="any">
        </div>

        <div class="input-group">
            <label for="da">Dearness Allowance (DA)</label>
            <input type="number" id="da" placeholder="e.g. 5000" min="0" step="any">
        </div>

        <div class="input-group">
            <label for="sc">Special Compensation (SC)</label>
            <input type="number" id="sc" placeholder="e.g. 2000" min="0" step="any">
        </div>

        <div class="input-group">
            <label for="fb">Fringe Benefits (FB)</label>
            <input type="number" id="fb" placeholder="e.g. 1000" min="0" step="any">
        </div>

        <!-- Month & Year Selector -->
        <div class="input-group">
            <label for="monthPicker">Select Month & Year</label>
            <input type="month" id="monthPicker" onchange="updateDaysDisplay()">
            <div class="days-badge" id="daysBadge">Days in month: --</div>
        </div>

        <div class="input-group">
            <label for="otHours">Overtime Worked (Hours)</label>
            <select id="otHours">
                <!-- Dynamically populated via JS from 1 to 120 -->
            </select>
        </div>

        <button onclick="calculateOT()">Calculate OT Amount</button>

        <div class="result-box">
            <div class="result-title">Total Overtime Pay</div>
            <div class="result-amount" id="result">0.00</div>
        </div>

        <div class="formula-note">
            Formula: { (Basic + DA + SC + FB) / (Days in Month × 8) } × Hours × 2
        </div>
    </div>

    <script>
        // Populate OT Hours Dropdown (1 to 120)
        const otSelect = document.getElementById('otHours');
        for (let i = 1; i <= 120; i++) {
            const option = document.createElement('option');
            option.value = i;
            option.textContent = i + (i === 1 ? ' Hour' : ' Hours');
            otSelect.appendChild(option);
        }

        // Set current month as default when the page opens
        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            document.getElementById('monthPicker').value = `${year}-${month}`;
            updateDaysDisplay();
        });

        // Helper function to find total days in the selected month & year
        function getDaysInMonth(year, month) {
            return new Date(year, month, 0).getDate();
        }

        // Update the badge text under the month selector
        function updateDaysDisplay() {
            const monthVal = document.getElementById('monthPicker').value;
            if (!monthVal) return 0;

            const [year, month] = monthVal.split('-').map(Number);
            const days = getDaysInMonth(year, month);
            document.getElementById('daysBadge').textContent = `Days in month: ${days} Days`;
            return days;
        }

        // OT Calculation Function
        function calculateOT() {
            const basic = parseFloat(document.getElementById('basic').value) || 0;
            const da = parseFloat(document.getElementById('da').value) || 0;
            const sc = parseFloat(document.getElementById('sc').value) || 0;
            const fb = parseFloat(document.getElementById('fb').value) || 0;

            const monthVal = document.getElementById('monthPicker').value;
            const otHours = parseFloat(document.getElementById('otHours').value);

            if (!monthVal) {
                alert("Please select a month and year.");
                return;
            }

            if (basic === 0) {
                alert("Please enter at least the Basic Pay.");
                return;
            }

            // Get exact days for the selected month/year
            const [year, month] = monthVal.split('-').map(Number);
            const daysInMonth = getDaysInMonth(year, month);

            // Calculation Logic:
            // Formula = {(Basic + DA + SC + FB) / (Days in month * 8)} * hour OT work * 2
            const totalEarnings = basic + da + sc + fb;
            const workingHours = daysInMonth * 8;
            const hourlyRate = totalEarnings / workingHours;
            const otAmount = hourlyRate * otHours * 2;

            // Display formatted result
            document.getElementById('result').textContent = otAmount.toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }
    </script>
</body>
</html>
